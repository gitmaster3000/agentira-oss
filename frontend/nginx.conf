server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend via Railway's public edge.
    # We don't use the private (*.railway.internal) hostname because it's
    # IPv6-only and nginx's default startup resolver is IPv4-only; the
    # public edge stays inside Railway's network and adds negligible latency.
    location /api/ {
        client_max_body_size 0;  # no proxy limit: projects unlimited, task 200M cap enforced in UI
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        # ${API_UPSTREAM}/${API_HOST} are envsubst'd at startup (same mechanism
        # as ${PORT}). They default to prod (baked in the Dockerfile); preview /
        # staging envs override them to a non-prod API so previews never touch
        # prod data. See AP-288.
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA fallback — serve index.html for all non-file routes
    # Never cache index.html so the deployed bundle hash is always fresh
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
