name: PR Preview (Railway)

# Automatic frontend PR previews (AP-287). Railway auto-creates an empty
# "agentira-frontend-pr-<N>" environment per PR but, in focused-PR mode, never
# attaches the frontend service — so nothing deploys. This workflow fires on
# every PR and populates that env via the Railway API (create service from the
# branch → public domain → deploy), then comments the URL. Triggered by the PR,
# deploys into Railway — no manual step.
#
# Requires repo secret RAILWAY_API_TOKEN (railway.com → Account → Tokens).

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One in-flight run per PR; newer pushes supersede older preview deploys.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend preview to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::RAILWAY_API_TOKEN secret is not set — add it in repo Settings → Secrets."
            exit 1
          fi
          bash scripts/railway-pr-preview.sh "${{ github.event.number }}" "${{ github.head_ref }}" | tee preview.out

      - name: Comment the preview URL on the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.up\.railway\.app' preview.out 2>/dev/null | tail -1 || true)
          [ -n "$URL" ] || exit 0
          gh pr comment "${{ github.event.number }}" --body "🚆 **Frontend preview:** $URL
          Log in with the staging **test user** (username/password) — Google OAuth won't work on per-PR preview domains (origin_mismatch)."
