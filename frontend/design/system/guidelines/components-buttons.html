<!-- @dsCard group="Components" viewport="700x430" subtitle="Variants, sizes, states & segmented toggle" name="Buttons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 28px; display: flex; flex-direction: column; gap: 20px; }
  .eyebrow { font: var(--type-meta); font-weight: var(--weight-semibold); text-transform: uppercase;
             letter-spacing: var(--tracking-eyebrow); color: var(--text-section); margin-bottom: 13px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-sans);
         font-size: 13px; font-weight: var(--weight-semibold); border-radius: var(--radius-lg);
         border: 1px solid transparent; cursor: pointer; padding: 8px 16px; transition: all var(--dur-base) var(--ease-standard); }
  .btn-primary   { background: var(--brand-lavender); color: var(--surface-base); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-secondary { background: var(--surface-card); color: var(--text-primary); border-color: var(--border-strong); }
  .btn-secondary:hover { background: var(--surface-hover); }
  .btn-ghost     { background: transparent; color: var(--brand-lavender); }
  .btn-ghost:hover { background: var(--tint-lavender); }
  .btn-positive  { background: var(--tint-teal); color: var(--brand-teal); border-color: rgba(128,203,196,.4); }
  .btn-danger    { background: var(--tint-danger); color: var(--danger); border-color: rgba(248,81,73,.4); }
  .btn-icon { padding: 8px; width: 34px; height: 34px; justify-content: center; }

  .btn-sm { padding: 5px 11px; font-size: 12px; border-radius: var(--radius-md); }
  .btn-lg { padding: 11px 22px; font-size: 14px; }

  .btn:disabled, .btn-disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .btn-loading { color: transparent; position: relative; pointer-events: none; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface-base);
             border-top-color: transparent; animation: spin .7s linear infinite; position: absolute;
             left: 50%; top: 50%; margin: -7px 0 0 -7px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* split button */
  .split { display: inline-flex; }
  .split .btn-primary { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .split .caret { background: var(--brand-lavender); color: var(--surface-base); border: 0;
                  border-left: 1px solid rgba(14,17,23,.25); border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
                  padding: 8px 9px; cursor: pointer; display: inline-flex; align-items: center; }

  /* segmented toggle */
  .seg { display: inline-flex; background: var(--surface-base); border: 1px solid var(--border-default);
         border-radius: var(--radius-lg); padding: 3px; gap: 2px; }
  .seg button { font-family: var(--font-sans); font-size: 12.5px; font-weight: var(--weight-medium);
                border: 0; background: transparent; color: var(--text-muted); cursor: pointer;
                padding: 5px 13px; border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: 6px; }
  .seg button.on { background: var(--surface-card); color: var(--text-primary); font-weight: var(--weight-semibold); }

  svg { width: 15px; height: 15px; }
  .seg svg { width: 13px; height: 13px; }
</style>
</head>
<body>
  <div>
    <div class="eyebrow">Variants</div>
    <div class="row">
      <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>New task</button>
      <button class="btn btn-secondary">Assign agent</button>
      <button class="btn btn-ghost">View runs</button>
      <button class="btn btn-positive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>Approve</button>
      <button class="btn btn-danger">Cancel run</button>
      <button class="btn btn-secondary btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="12" r="1.6"/></svg></button>
    </div>
  </div>

  <div>
    <div class="eyebrow">Sizes</div>
    <div class="row">
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary">Medium</button>
      <button class="btn btn-primary btn-lg">Large</button>
      <span class="split">
        <button class="btn btn-primary">Dispatch</button>
        <button class="caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>
      </span>
    </div>
  </div>

  <div>
    <div class="eyebrow">States</div>
    <div class="row">
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-disabled">Disabled</button>
      <button class="btn btn-primary btn-loading">Running<span class="spinner"></span></button>
      <button class="btn btn-secondary btn-disabled">Disabled</button>
    </div>
  </div>

  <div>
    <div class="eyebrow">Segmented toggle</div>
    <div class="row">
      <div class="seg">
        <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="11" width="18" height="4" rx="1"/><rect x="3" y="18" width="18" height="3" rx="1"/></svg>List</button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="6" height="16" rx="1"/><rect x="11" y="4" width="6" height="11" rx="1"/></svg>Board</button>
      </div>
    </div>
  </div>
</body>
</html>
