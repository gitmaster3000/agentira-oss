[project]
name = "agentira"
version = "0.1.0"
description = "Lean task manager for AI agents with human oversight"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "mcp[cli]>=1.28.0,<2",
    "google-auth>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "websocket-client>=1.7.0",
    "psycopg2-binary>=2.9.0",
    "PyJWT>=2.8.0",
    "APScheduler>=3.10.0",
    "PyYAML>=6.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist>=3.5.0", "httpx", "testcontainers[postgres]>=4.0.0"]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
