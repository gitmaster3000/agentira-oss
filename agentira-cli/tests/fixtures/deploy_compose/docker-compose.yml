# Two services: `web` is public and answers only when it can reach `api`
# over the compose network. The fixed host port on `web` is deliberate — the
# daemon must remap it so two branches never collide.
services:
  api:
    build: ./api
  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - api
