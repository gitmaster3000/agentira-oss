[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentira-cli"
version = "0.1.2"
description = "AgentIRA local CLI + daemon — runtime auto-detection and agent execution"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "websocket-client>=1.7.0",
    "certifi>=2024.2.2",
]

[project.scripts]
agentira = "agentira_cli.main:app"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["agentira_cli*"]
