# Dev override — auto-loaded by `docker compose up`. NOT for QA/prod.
# Hot-reloads backend on file changes (via volume mount + uvicorn --reload).
# JWT_SECRET is intentionally hard-coded so tokens survive container restarts.

services:
  backend:
    ports:
      - "8111:8111"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      # AP-157: agent templates are app code (versioned with the repo),
      # not user data. Bind-mounted in dev so edits to templates/agents/
      # are picked up without a rebuild.
      - ./templates:/app/templates
    environment:
      # Stable across rebuilds so browser logins don't die — dev only.
      - JWT_SECRET=dev-only-not-for-prod-32-byte-secret-12345678901234
      # Local Postgres for prod parity (prod runs Postgres on Railway) — catches
      # PG-specific behavior in dev/preview. wait_for_db() + depends_on gate on a
      # healthy DB. /app/data (agentira-data volume) still holds attachments.
      - AGENTIRA_DB_URL=postgresql://agentira:agentira@postgres:5432/agentira
      # Environment marker — provider-agnostic dev/prod switch (config, not
      # code). Gates the daemon auth bypass below; prod configs leave it 'prod'
      # (the code default), so the bypass is fail-safe OFF everywhere else.
      - AGENTIRA_ENV=dev
      # Dev-only daemon auth bypass (see backend/jwt_auth._dev_bypass_payload):
      # a daemon presenting this key authenticates as the 'preview' profile —
      # no browser login. Only honored when AGENTIRA_ENV=dev.
      - AGENTIRA_DEV_API_KEY=dev-daemon-key-local-only
      - AGENTIRA_DEV_PROFILE=preview
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    ports:
      - "8000:8000"
    environment:
      # Same Postgres as the backend so MCP reads/writes the same data.
      - AGENTIRA_DB_URL=postgresql://agentira:agentira@postgres:5432/agentira
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./templates:/app/templates

  # Dev frontend = Vite dev server with HMR. Source is bind-mounted so
  # edits to .jsx / .css land in the browser within ~100ms. Compare with
  # qa/prod which keep the nginx-served-built-bundle Dockerfile.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3111:3111"
    environment:
      # vite proxy hits the docker network's backend, not localhost.
      - VITE_PROXY_TARGET=http://backend:8111
    volumes:
      - ./frontend:/app
      # Anonymous volume so the host's node_modules (or absence of)
      # doesn't shadow the image's npm ci output.
      - /app/node_modules

  # Local Postgres — prod parity (Railway prod runs Postgres). Dev-only creds.
  # Pin the same image as qa/prod and the test harness (postgres:16-alpine).
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=agentira
      - POSTGRES_PASSWORD=agentira
      - POSTGRES_DB=agentira
    ports:
      - "5432:5432"   # exposed for laptop tools / one-off psql
    volumes:
      - agentira-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentira -d agentira"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  agentira-pg:
