name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up -d
        2. …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Backend / API
        - MCP server
        - Frontend / UI
        - Daemon or CLI
        - Deployment / self-hosting
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: "`git rev-parse --short HEAD`, or the release you're on."
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15 · Docker 27 · Python 3.11 · claude CLI"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker compose logs backend`, `agentira daemon logs`, or the browser console. Redact keys and tokens before pasting."
      render: text
