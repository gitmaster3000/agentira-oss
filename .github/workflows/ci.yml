name: CI

# Gate merges to main and validate every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Backend tests ───────────────────────────────────────────────────────
  # Ephemeral Postgres via testcontainers — same harness as local dev.
  unit-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest backend/tests/ -q -n 4 --dist loadscope

  # ── CLI packaging smoke ─────────────────────────────────────────────────
  # Fresh venv + `pip install -e ./agentira-cli` only. Catches missing
  # pyproject deps (e.g. websocket-client for OpenClaw native WS) that unit
  # tests miss because they stub the import. See test_runtime_deps.py.
  cli-deps-smoke:
    name: CLI deps smoke (fresh install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CLI only in an isolated venv
        run: |
          python -m venv /tmp/agentira-cli-smoke
          /tmp/agentira-cli-smoke/bin/pip install --upgrade pip
          /tmp/agentira-cli-smoke/bin/pip install -e ./agentira-cli

      - name: Runtime import smoke tests
        run: /tmp/agentira-cli-smoke/bin/python agentira-cli/tests/test_runtime_deps.py

  # ── Docker compose lint ─────────────────────────────────────────────────
  # Validates whatever compose files are present on the branch. After
  # AP-31 (PR #14) merges, qa/prod compose files appear and this job
  # picks them up automatically — no workflow change needed.
  compose-validate:
    name: Compose configs validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate default compose (base + auto-loaded override if any)
        run: docker compose config --quiet

      - name: Validate qa override (if present)
        env:
          JWT_SECRET: ci-fake-secret
          POSTGRES_PASSWORD: ci-fake-pw
        run: |
          if [ -f docker-compose.qa.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.qa.yml config --quiet
          else
            echo "docker-compose.qa.yml not present on this branch — skipping"
          fi

      - name: Validate prod override (if present)
        env:
          JWT_SECRET: ci-fake-secret
          POSTGRES_PASSWORD: ci-fake-pw
        run: |
          if [ -f docker-compose.prod.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          else
            echo "docker-compose.prod.yml not present on this branch — skipping"
          fi

  # ── Integration smoke ───────────────────────────────────────────────────
  # Boots the full dev stack and verifies the backend serves /api/auth/config.
  # Catches obvious wire-up regressions (missing env, broken Dockerfile).
  integration-smoke:
    name: Integration smoke
    runs-on: ubuntu-latest
    needs: compose-validate
    steps:
      - uses: actions/checkout@v4

      # Bring up only backend + mcp. Frontend is in a sibling repo with
      # its own CI, and its dev nginx config (mounted via the dev
      # override) lives outside source control. The smoke we care about
      # here is "does the API stack boot end-to-end?" — frontend isn't
      # part of that loop.
      - name: Bring up backend + mcp
        run: docker compose up -d --build backend mcp

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8111/api/auth/config >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became ready"
          docker compose logs backend
          exit 1

      - name: Probe MCP endpoint
        run: |
          # MCP without a session id returns 4xx, but the connection
          # should at least succeed (i.e. not connection refused).
          curl -s -o /dev/null -w "MCP: %{http_code}\n" http://localhost:8000/mcp || \
            { echo "MCP unreachable"; docker compose logs mcp; exit 1; }

      - name: Tear down
        if: always()
        run: docker compose down -v
