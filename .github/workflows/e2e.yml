name: E2E (browser)
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/seed_e2e_user.py'
      - 'Dockerfile'
      - 'docker-compose.e2e.yml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# A newer push to the same PR replaces the running browser tests.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# No secrets are used anywhere, so fork PRs run too: the token is read-only.
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -p ap-e2e-${{ github.run_id }} -f docker-compose.e2e.yml
      E2E_BASE_URL: http://localhost:3211
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Isolated stack: throwaway Postgres + backend + the production nginx
      # frontend image, built from this PR's code.
      - name: Start the stack
        run: $COMPOSE up -d --build --wait
      - name: Seed the e2e user
        run: $COMPOSE exec -T backend python scripts/seed_e2e_user.py

      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Show stack logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
