name: Backend tests

# Runs backend/tests/ directly on PRs. ci.yml only runs tests/ and never
# installs testcontainers; the full backend/tests/ suite otherwise only
# runs via integration-test.yml's self-hosted /integration-test comment
# trigger. This gives PRs standing evidence without that manual step.
on:
  pull_request:
    branches: [main-2, main]
  push:
    branches: [main-2]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest backend/tests/ -q
