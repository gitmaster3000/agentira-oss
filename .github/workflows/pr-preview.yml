name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  deployments: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview PR #${{ github.event.pull_request.number }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 30

    steps:
      - name: Check out PR head
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out base for teardown
        if: github.event.action == 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set preview metadata
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          preview_port=$((4000 + PR_NUMBER))

          case "$preview_port" in
            3113|8000|8111|55432)
              echo "::error::Calculated preview port $preview_port is reserved"
              exit 1
              ;;
          esac
          if (( preview_port > 65535 )); then
            echo "::error::Calculated preview port $preview_port is outside the TCP port range"
            exit 1
          fi

          {
            echo "project=pr-${PR_NUMBER}"
            echo "environment=pr-${PR_NUMBER}"
            echo "port=${preview_port}"
            echo "url=http://127.0.0.1:${preview_port}"
            echo "override=${RUNNER_TEMP_DIR}/pr-${PR_NUMBER}-compose.yml"
          } >> "$GITHUB_OUTPUT"

      - name: Write preview Compose override
        env:
          OVERRIDE_FILE: ${{ steps.preview.outputs.override }}
          PREVIEW_PORT: ${{ steps.preview.outputs.port }}
        run: |
          cat > "$OVERRIDE_FILE" <<EOF
          services:
            frontend:
              ports:
                - "127.0.0.1:${PREVIEW_PORT}:80"
          EOF

      - name: Create GitHub deployment
        if: github.event.action != 'closed'
        id: deployment
        uses: actions/github-script@v7
        env:
          PREVIEW_ENVIRONMENT: ${{ steps.preview.outputs.environment }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.ref,
              task: 'deploy',
              auto_merge: false,
              required_contexts: [],
              environment: process.env.PREVIEW_ENVIRONMENT,
              transient_environment: true,
              production_environment: false,
              description: `Local Docker preview for PR #${context.payload.pull_request.number}`,
            });
            core.setOutput('deployment_id', deployment.data.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              environment: process.env.PREVIEW_ENVIRONMENT,
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Building the PR preview on the self-hosted runner',
            });

      - name: Build and start preview
        if: github.event.action != 'closed'
        env:
          COMPOSE_PROJECT: ${{ steps.preview.outputs.project }}
          OVERRIDE_FILE: ${{ steps.preview.outputs.override }}
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f docker-compose.yml \
            -f "$OVERRIDE_FILE" \
            up -d --build

      - name: Health-check preview
        if: github.event.action != 'closed'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          COMPOSE_PROJECT: ${{ steps.preview.outputs.project }}
          OVERRIDE_FILE: ${{ steps.preview.outputs.override }}
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$PREVIEW_URL" >/dev/null; then
              echo "Preview is healthy at $PREVIEW_URL (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Preview did not become healthy at $PREVIEW_URL"
          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f docker-compose.yml \
            -f "$OVERRIDE_FILE" \
            ps
          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f docker-compose.yml \
            -f "$OVERRIDE_FILE" \
            logs --no-color
          exit 1

      - name: Publish deployment result
        if: always() && github.event.action != 'closed' && steps.deployment.outputs.deployment_id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          PREVIEW_ENVIRONMENT: ${{ steps.preview.outputs.environment }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const state = process.env.PREVIEW_STATE;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              environment: process.env.PREVIEW_ENVIRONMENT,
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success'
                ? 'PR preview is healthy'
                : 'PR preview failed; see the workflow logs',
            });

      - name: Tear down preview
        if: github.event.action == 'closed'
        env:
          COMPOSE_PROJECT: ${{ steps.preview.outputs.project }}
          OVERRIDE_FILE: ${{ steps.preview.outputs.override }}
        run: |
          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f docker-compose.yml \
            -f "$OVERRIDE_FILE" \
            down -v --remove-orphans

      - name: Mark deployment inactive
        if: always() && github.event.action == 'closed'
        uses: actions/github-script@v7
        env:
          PREVIEW_ENVIRONMENT: ${{ steps.preview.outputs.environment }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: process.env.PREVIEW_ENVIRONMENT,
              per_page: 1,
            });
            if (deployments.data.length === 0) {
              core.notice(`No deployment found for ${process.env.PREVIEW_ENVIRONMENT}`);
              return;
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployments.data[0].id,
              state: 'inactive',
              environment: process.env.PREVIEW_ENVIRONMENT,
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'PR closed; local Docker preview removed',
            });
