name: Release agentira-cli

# Verify the CLI wheel builds cleanly. The wheel ships inside the backend
# Docker image on every Railway deploy (see Dockerfile + write_cli_manifest.py).
# Customers install/upgrade from their instance URL — not GitHub.
#
# Optional: push tag agentira-cli-v0.1.0 after bumping agentira-cli/pyproject.toml
# to mark a release before deploying to Railway.
on:
  push:
    tags:
      - "agentira-cli-v*"
  workflow_dispatch:

jobs:
  verify-wheel:
    name: Build wheel (ships on next Railway deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + manifest
        run: |
          python -m pip install --upgrade pip build
          python -m build agentira-cli/ -o /tmp/cli-dist
          mkdir -p backend/static/cli/wheels
          cp /tmp/cli-dist/*.whl backend/static/cli/wheels/
          python scripts/write_cli_manifest.py
          ls -la backend/static/cli/ backend/static/cli/wheels/

      - name: Upload wheel artifact (operator reference)
        uses: actions/upload-artifact@v4
        with:
          name: agentira-cli-wheel
          path: backend/static/cli/