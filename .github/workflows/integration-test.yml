name: Integration test (full suite)

# On-demand full suite: backend/tests/ (ephemeral Postgres) plus
# agentira-cli/tests/ (daemon/git unit tests with real git configured).
#
# Trigger: comment `/integration-test` on a pull request.
#
# NOTE (GitHub behavior): issue_comment workflows always run the version of
# this file on the repository's DEFAULT branch, not the PR branch. So this
# trigger only works once this file is merged to main. It then checks out the
# PR's head and tests that.
on:
  issue_comment:
    types: [created]

jobs:
  full-suite:
    name: Full suite (backend/tests/ + agentira-cli/tests/)
    # Only on PR comments that issue the command.
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/integration-test')
    # Runs on YOUR local docker host — register a self-hosted runner there
    # (Settings → Actions → Runners). Switch to `ubuntu-latest` to run on a
    # GitHub-hosted runner instead (also has python, git and docker).
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Acknowledge the command
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'rocket',
            });

      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend + CLI (+ dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./agentira-cli

      - name: Configure git (daemon tests drive real git)
        run: |
          git config --global user.email ci@agentira.test
          git config --global user.name "agentira ci"
          git config --global init.defaultBranch main

      - name: Backend suite (ephemeral Postgres)
        run: python -m pytest backend/tests/ -q

      - name: Daemon / CLI suite (real git, no network)
        run: python -m pytest agentira-cli/tests/ -q

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${ok ? '✅' : '❌'} Integration test (full suite) **${{ job.status }}** — [logs](${url})`,
            });
