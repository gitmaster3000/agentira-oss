# Default project workflow — SYSTEM config (ships with the product).
#
# Parsed with yaml.safe_load + a Pydantic schema (backend/forge/workflow.py).
# The pipeline here (columns + on_success semantics) is system-owned and NOT
# customer-editable: customers can view it, and override only the `roles`
# section per project via Project.workflow_roles_json (who reviews, exclusion,
# fallback) — they cannot rewire the flow itself.
#
# Semantics, interpreted by backend/forge/workflow.py (a Conductor helper —
# token-free script, same code+LLM split as the queue tick):
#
#   columns:        the board columns in pipeline order.
#   on_success:     what the driver does when a task's run finishes
#                   `succeeded` while the task sits in that column:
#                     advance_to:    move the task to this column (the move is
#                                    still gate-checked via backend/gates.py —
#                                    failing evidence blocks the advance).
#                     assign_role:   pick the new assignee by role (see roles).
#                     dispatch:      true → dispatch the new assignee's run
#                                    immediately (the Conductor tick only
#                                    dispatches `todo`, so hand-offs dispatch
#                                    directly).
#   roles:          how a role name maps to an agent at runtime (the ONLY
#                   customer-overridable section):
#                     match:   case-insensitive substrings matched against
#                              agent names (first hit wins).
#                     exclude_previous_assignee: true → the picked agent must
#                              differ from the agent whose run just finished
#                              (e.g. reviewer != implementer).
#                     fallback: any | none — `any` picks the least-loaded
#                              eligible agent when no name matches; `none`
#                              leaves the task un-advanced (safer for review).
#                     prompt:  templates/workflow/prompts/<prompt>.md — hand-
#                              off instructions dispatched to the role
#                              (config, customer-readable). Empty -> defaults
#                              to a file named after the role itself (e.g.
#                              role "reviewer" -> prompts/reviewer.md).
#                              Missing file -> dispatch proceeds without it.

columns:
  - name: backlog
  - name: todo
  - name: in_progress
    # A person dragging a task here starts its assigned agent on it.
    on_enter:
      dispatch_assignee: true
    on_success:
      advance_to: review
      assign_role: reviewer
      dispatch: true
  - name: review
    on_success:
      advance_to: done
      assign_role: null        # done is terminal for now; docs step = next slice
      dispatch: false
      # Two-phase advance: the reviewer's approval triggers a deterministic
      # daemon-side merge of the task branch into the target; the task only
      # reaches done when the merge (and push) succeed. Conflict -> the task
      # stays in review with a classified reason for the implementer.
      # target_branch omitted = the task repo's default_branch (never a
      # hardcoded main — Loop v1 C5).
      integrate:
        push: true
        # Loop v1 C6: the daemon runs the project's verify command
        # (Project Settings → "Command that proves the project works") on the
        # MERGED code and pushes only if it passes.
        verify:
          required: true              # no command set → merge refused
          default_timeout_minutes: 30 # when the project sets no limit
        # When the merge or the checks fail. Kinds are the daemon's classified
        # reasons. Listed kinds go back to whoever owes the fix, with the
        # failure output; anything else (push rejected, clone unavailable) is
        # infrastructure — the task stays put and admins are notified.
        # Shares the bounce budget below.
        on_failure:
          hand_back_on: [verify_failed, verify_timeout, merge_conflict, merge_failed, injected_files_committed]
          to_column: in_progress
          assign: previous_agent      # or a role name from `roles`
          dispatch: true
          prompt: integration_failed  # templates/workflow/prompts/<prompt>.md
  - name: done
    # Slice 3: a task arriving in done (branch merged) gets the documentation
    # role dispatched on it — docs are written AFTER review passes, about what
    # actually shipped. Skipped silently when the project has no doc agent.
    on_enter:
      dispatch_role: documentation

# AP-231 self-correction: a run that succeeds but fails the advance gate
# (missing DoD/branch evidence) is re-dispatched to the same agent with a
# corrective prompt, up to max_attempts total runs on the task within the
# window, then escalated to needs-attention (the Conductor's progress
# watchdog takes it from there). Set enabled:false to leave all recovery to
# the Conductor.
bounce:
  enabled: true
  max_attempts: 2        # original run + one corrective re-dispatch
  window_minutes: 30

# AP-252 rejection hand-back: when a task is deliberately moved BACKWARD
# during a run (a reviewer rejecting work, or a human demoting it), the driver
# does not try to advance — it routes the task to whoever owes the fix.
#   assign:   previous_agent → the last agent with a run on the task before
#             the rejecting run (the implementer). Or any role name from
#             `roles:` to route rejections to a fixed role instead.
#   dispatch: true → dispatch the corrective run immediately, carrying the
#             rejecter's latest task comment as context.
#   prompt:   templates/workflow/prompts/<prompt>.md — the corrective
#             instructions (config, customer-readable).
# Hand-backs share the bounce budget above (max_attempts in window) so two
# agents can never ping-pong forever; exhausted → needs-attention escalation.
# enabled:false → the driver just skips the advance and leaves recovery to
# the Conductor's progress watchdog.
rejection:
  enabled: true
  assign: previous_agent
  dispatch: true
  prompt: rejection_handback

# Moving a task by hand. dispatch: true → when a PERSON moves a task into a
# column, that column's agent gets the column's prompt — the role entering it
# (review → reviewer, done → documentation; an assigned agent that fits the
# role is kept) or, where on_enter.dispatch_assignee is set, the task's
# assigned agent. Nothing is sent while a run is active, and moves made by
# agents or by the workflow itself never trigger it.
manual_move:
  dispatch: true

roles:
  reviewer:
    match: ["review", "senior", "lead", "architect"]
    exclude_previous_assignee: true
    fallback: none
  documentation:
    match: ["doc", "documentation", "writer"]
    exclude_previous_assignee: false
    fallback: none
